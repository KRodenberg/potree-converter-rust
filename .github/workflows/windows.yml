name: Windows portable build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run tests
        run: cargo test --locked
      - name: Build portable package
        shell: powershell
        run: .\scripts\package.ps1
      - name: Upload portable executable and notices
        uses: actions/upload-artifact@v4
        with:
          name: Potree-Converter-windows-x64
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

