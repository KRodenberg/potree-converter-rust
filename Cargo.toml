[package]
name = "potree-converter"
version = "1.0.0"
edition = "2021"
description = "Portable desktop LAS, LAZ and E57 to Potree converter"
license = "MIT"
repository = "https://github.com/KRodenberg/potree-converter-rust"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
eframe = { version = "0.29.1", default-features = false, features = ["default_fonts", "glow"] }
rfd = "0.15.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
las = { version = "0.9", features = ["laz"] }
e57 = "0.11"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

